<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smart Table Order</title>

  <!-- PWA & Mobile WebApp Capabilities -->
  <meta name="theme-color" content="#00454f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #appFrame {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <iframe
    id="appFrame"
    src=""
    allow="geolocation; camera; microphone; clipboard-read; clipboard-write; payment; fullscreen"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads allow-top-navigation-by-user-activation">
  </iframe>

  <script>
    (function() {
      // 1. URL WebApp Apps Script Exec Anda
      var GAS_EXEC_URL = "https://script.google.com/macros/s/AKfycbwap6K0GrnGNJwQJjrac4nHz5cdfeRc6B5GczN6lS40E5nTP-RhqAbRBJ4U65mnVDYkVA/exec";

      // 2. Ekstraksi nomor meja dari URL browser (Query Params atau Hash QR)
      var currentUrl = new URL(window.location.href);
      var tableParam = currentUrl.searchParams.get('meja') || 
                       currentUrl.searchParams.get('table') || 
                       currentUrl.searchParams.get('m');

      // Dukungan format hash (#meja=05 atau #05)
      if (!tableParam && window.location.hash) {
        var hashClean = window.location.hash.replace('#', '');
        var hashMatch = hashClean.match(/(?:meja|table)=([^&]+)/i);
        if (hashMatch) {
          tableParam = hashMatch[1];
        } else if (/^\d+$/.test(hashClean)) {
          tableParam = hashClean;
        }
      }

      // Format nomor meja default jika tidak ada di URL
      var tableNumber = tableParam ? String(tableParam).trim() : '01';
      var tableFormatted = /^\d+$/.test(tableNumber) ? ('Meja ' + tableNumber.padStart(2, '0')) : tableNumber;

      // 3. Teruskan seluruh query parameter ke WebApp
      currentUrl.searchParams.set('meja', tableNumber);
      var targetSrc = GAS_EXEC_URL + '?' + currentUrl.searchParams.toString();

      // 4. Set src iframe secara langsung
      var iframe = document.getElementById('appFrame');
      if (iframe) {
        iframe.src = targetSrc;

        // PostMessage jaminan nomor meja saat iframe selesai memuat
        iframe.onload = function() {
          try {
            iframe.contentWindow.postMessage({ meja: tableFormatted, table: tableFormatted }, '*');
          } catch (e) {}
        };
      }
    })();
  </script>
</body>
</html>
